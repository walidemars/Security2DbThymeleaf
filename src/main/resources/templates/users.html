<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Пользователи</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">Каталог фильмов</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/index}">Главная</a>
        </div>
    </div>
</nav>
<br/><br/>
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>Список зарегистрированных пользователей</h2>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Роли</th>
                    <th sec:authorize="hasRole('ADMIN')">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.id}"></td>
                    <td th:text="${user.username}"></td>
                    <td th:text="${user.email}"></td>
                    <td>
                        <span th:each="role : ${user.roles}" class="badge bg-secondary me-1">
                            <span th:text="${role.name}"></span>
                        </span>
                    </td>
                    <td sec:authorize="hasRole('ADMIN')">
                        <a th:href="@{/users/edit-roles(userId=${user.id})}"
                           class="btn btn-sm btn-primary me-1">
                            Изменить роли
                        </a>
                        <a th:href="@{/users/delete(userId=${user.id})}"
                           class="btn btn-sm btn-danger"
                           onclick="return confirm('Удалить пользователя?')">
                            Удалить
                        </a>
                    </td>
                </tr>
                </tbody>
            </table>
            <div class="mt-3">
                <a th:href="@{/index}" class="btn btn-secondary">Главная</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
