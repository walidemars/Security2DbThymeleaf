<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Список актеров</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">Каталог фильмов</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/index}">Главная</a>
        </div>
    </div>
</nav>
<br/><br/>
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>Список актеров</h2>
            <div th:if="${canEdit}" class="mb-3">
                <a th:href="@{/actors/add}" class="btn btn-primary">Добавить актера</a>
            </div>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Имя</th>
                    <th>Фамилия</th>
                    <th>Возраст</th>
                    <th>Страна</th>
                    <th th:if="${canEdit}">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="actor : ${actors}">
                    <td th:text="${actor.id}"></td>
                    <td>
                        <a th:href="@{/actors/{id}(id=${actor.id})}"
                           th:text="${actor.name}"></a>
                    </td>
                    <td th:text="${actor.surname}"></td>
                    <td th:text="${actor.age}"></td>
                    <td th:text="${actor.country}"></td>
                    <td th:if="${canEdit}">
                        <a th:href="@{/actors/update(actorId=${actor.id})}" class="btn btn-sm btn-warning">Изменить</a>
                        <a th:href="@{/actors/delete(actorId=${actor.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Вы уверены, что хотите удалить этого актера?')">Удалить</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
