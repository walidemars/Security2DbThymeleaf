<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Список фильмов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">Каталог фильмов</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/index}">Главная</a>
        </div>
    </div>
</nav>
<br/><br/>
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>Список фильмов</h2>
            <div th:if="${canEdit}" class="mb-3">
                <a th:href="@{/movies/add}" class="btn btn-primary">Добавить фильм</a>
            </div>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Название</th>
                    <th>Режиссер</th>
                    <th>Год</th>
                    <th>Жанр</th>
                    <th>Длительность (мин)</th>
                    <th th:if="${canEdit}">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="movie : ${movies}">
                    <td th:text="${movie.id}"></td>
                    <td>
                        <a th:href="@{/movies/{id}(id=${movie.id})}"
                           th:text="${movie.title}"></a>
                    </td>
                    <td th:text="${movie.director}"></td>
                    <td th:text="${movie.year}"></td>
                    <td th:text="${movie.genre}"></td>
                    <td th:text="${movie.duration}"></td>
                    <td th:if="${canEdit}">
                        <a th:href="@{/movies/update(movieId=${movie.id})}" class="btn btn-sm btn-warning">Изменить</a>
                        <a th:href="@{/movies/delete(movieId=${movie.id})}" class="btn btn-sm btn-danger" 
                           onclick="return confirm('Вы уверены, что хотите удалить этот фильм?')">Удалить</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
