<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Добавить/Изменить кассовые сборы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">Каталог фильмов</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/boxoffice}">Назад к списку</a>
        </div>
    </div>
</nav>
<br/><br/>
<div class="container">
    <div class="row">
        <div class="col-md-6 offset-md-3">
            <div class="card">
                <div class="card-header">
                    <h3 th:text="${boxOffice.id != null ? 'Изменить кассовые сборы' : 'Добавить кассовые сборы'}"></h3>
                </div>
                <div class="card-body">
                    <form th:action="@{/boxoffice/save}" method="post">
                        <input type="hidden" th:if="${boxOffice.id != null}" th:field="${boxOffice.id}" name="id"/>
                        <div class="mb-3">
                            <label class="form-label">Фильм</label>
                            <select class="form-select" name="movieId" required>
                                <option value="">Выберите фильм</option>
                                <option th:each="movie : ${movies}" 
                                        th:value="${movie.id}" 
                                        th:text="${movie.title}"
                                        th:selected="${boxOffice.movie != null && boxOffice.movie.id != null && boxOffice.movie.id == movie.id}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Сборы</label>
                            <input type="number" step="0.01" class="form-control" th:field="${boxOffice.revenue}" name="revenue" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Валюта</label>
                            <input type="text" class="form-control" th:field="${boxOffice.currency}" name="currency" required/>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Год</label>
                            <input type="number" class="form-control" th:field="${boxOffice.year}" name="year" required/>
                        </div>
                        <button type="submit" class="btn btn-primary">Сохранить</button>
                        <a th:href="@{/boxoffice}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
