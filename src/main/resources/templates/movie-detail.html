<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title th:text="${movie.title}">Фильм</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">Каталог фильмов</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/movies}">К списку фильмов</a>
        </div>
    </div>
</nav>
<br/><br/>
<div class="container">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <h3 class="mb-0" th:text="${movie.title}">Название фильма</h3>
                    <div th:if="${canEdit}">
                        <a th:href="@{/movies/update(movieId=${movie.id})}" class="btn btn-sm btn-warning">Изменить</a>
                    </div>
                </div>
                <div class="card-body">
                    <dl class="row">
                        <dt class="col-sm-4">Режиссер</dt>
                        <dd class="col-sm-8" th:text="${movie.director}"></dd>

                        <dt class="col-sm-4">Год</dt>
                        <dd class="col-sm-8" th:text="${movie.year}"></dd>

                        <dt class="col-sm-4">Жанр</dt>
                        <dd class="col-sm-8" th:text="${movie.genre}"></dd>

                        <dt class="col-sm-4">Длительность</dt>
                        <dd class="col-sm-8">
                            <span th:text="${movie.duration}"></span> мин
                        </dd>

                        <dt class="col-sm-4">Бюджет</dt>
                        <dd class="col-sm-8">
                            <span th:if="${movie.budget != null}"
                                  th:text="${#numbers.formatDecimal(movie.budget, 0, 'COMMA', 2, 'POINT')}"></span>
                            <span th:if="${movie.budget == null}">не указан</span>
                        </dd>

                        <dt class="col-sm-4">Кассовые сборы (общие)</dt>
                        <dd class="col-sm-8">
                            <span th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 2, 'POINT')}"></span>
                        </dd>
                    </dl>

                    <h5 class="mt-4">Актеры</h5>
                    <div th:if="${movie.actors == null || movie.actors.isEmpty()}">
                        <p>Информация об актерах отсутствует.</p>
                    </div>
                    <ul th:if="${movie.actors != null && !movie.actors.isEmpty()}" class="list-group">
                        <li class="list-group-item"
                            th:each="actor : ${movie.actors}">
                            <a th:href="@{/actors/{id}(id=${actor.id})}"
                               th:text="${actor.surname + ' ' + actor.name}"></a>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
