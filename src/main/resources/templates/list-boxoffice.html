<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>Кассовые сборы</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">Каталог фильмов</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/index}">Главная</a>
        </div>
    </div>
</nav>
<br/><br/>
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>Кассовые сборы</h2>
            <div th:if="${canEdit}" class="mb-3">
                <a th:href="@{/boxoffice/add}" class="btn btn-primary">Добавить запись о кассовых сборах</a>
            </div>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Фильм</th>
                    <th>Сборы</th>
                    <th>Валюта</th>
                    <th>Год</th>
                    <th th:if="${canEdit}">Действия</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="boxOffice : ${boxOffices}">
                    <td th:text="${boxOffice.id}"></td>
                    <td th:text="${boxOffice.movie.title}"></td>
                    <td th:text="${boxOffice.revenueFormatted}"></td>
                    <td th:text="${boxOffice.currency}"></td>
                    <td th:text="${boxOffice.year}"></td>
                    <td th:if="${canEdit}">
                        <a th:href="@{/boxoffice/update(boxOfficeId=${boxOffice.id})}" class="btn btn-sm btn-warning">Изменить</a>
                        <a th:href="@{/boxoffice/delete(boxOfficeId=${boxOffice.id})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('Вы уверены, что хотите удалить эту запись?')">Удалить</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
