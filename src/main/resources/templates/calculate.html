<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Расчет кассовых сборов</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">Каталог фильмов</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/index}">Главная</a>
        </div>
    </div>
</nav>
<br/><br/>
<div class="container">
    <div class="row">
        <div class="col-md-8 offset-md-2">
            <div class="card">
                <div class="card-header">
                    <h2>Расчет кассовых сборов</h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/calculate/result}" method="get">
                        <div class="mb-3">
                            <label class="form-label">Выберите фильм (необязательно)</label>
                            <select class="form-select" name="movieId">
                                <option value="">Все фильмы</option>
                                <option th:each="movie : ${movies}" 
                                        th:value="${movie.id}" 
                                        th:text="${movie.title}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Выберите год (необязательно)</label>
                            <input type="number" class="form-control" name="year" placeholder="Год" min="1900" max="2100"/>
                        </div>
                        <button type="submit" class="btn btn-primary">Рассчитать</button>
                        <a th:href="@{/index}" class="btn btn-secondary">Отмена</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
