<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Результаты расчета</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
          rel="stylesheet"
          integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
          crossorigin="anonymous">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/index}">Каталог фильмов</a>
        <div class="navbar-nav ms-auto">
            <a class="nav-link" th:href="@{/index}">Главная</a>
        </div>
    </div>
</nav>
<br/><br/>
<div class="container">
    <div class="row">
        <div class="col-md-12">
            <h2>Результаты расчета кассовых сборов</h2>
            <div th:if="${selectedMovie}" class="alert alert-info">
                <strong>Выбранный фильм:</strong> <span th:text="${selectedMovie.title}"></span>
            </div>
            <div th:if="${selectedYear}" class="alert alert-info">
                <strong>Выбранный год:</strong> <span th:text="${selectedYear}"></span>
            </div>
            <div class="card mb-3">
                <div class="card-body">
                    <h4>Общая сумма кассовых сборов: <span th:text="${totalRevenueFormatted}"></span></h4>
                    <p>Количество записей: <span th:text="${count}"></span></p>
                </div>
            </div>
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Фильм</th>
                    <th>Сборы</th>
                    <th>Валюта</th>
                    <th>Год</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="boxOffice : ${boxOffices}">
                    <td th:text="${boxOffice.id}"></td>
                    <td th:text="${boxOffice.movie.title}"></td>
                    <td th:text="${boxOffice.revenueFormatted}"></td>
                    <td th:text="${boxOffice.currency}"></td>
                    <td th:text="${boxOffice.year}"></td>
                </tr>
                </tbody>
            </table>
            <div class="mt-3">
                <a th:href="@{/calculate}" class="btn btn-primary">Новый расчет</a>
                <a th:href="@{/index}" class="btn btn-secondary">Главная</a>
            </div>
        </div>
    </div>
</div>
</body>
</html>
